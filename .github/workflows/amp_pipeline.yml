name: Matter 1B Amp Pipeline

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  run-amp:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
            python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir groq moviepy gTTS

      - name: Run Content Generator
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python amp/generator.py

      - name: Run Video Renderer
        run: |
          python amp/renderer.py

      - name: Commit and Push Assets
        run: |
          git config --global user.name "Matter 1B Amp Bot"
          git config --global user.email "amp@matter1b.com"
          git add amp/drafts/ amp/videos/
          git commit -m "Auto-generate new Matter 1B content bundle and animated video" || echo "No changes to commit"
          git push
