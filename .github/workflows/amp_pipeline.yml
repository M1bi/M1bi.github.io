name: Matter 1B Amp Engine

on:
  schedule:
    - cron: '0 8 * * *' # Runs daily at 8:00 AM UTC
  workflow_dispatch:     # Allows manual triggering from GitHub UI

jobs:
  run-amp-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install groq gTTS moviepy

      - name: Run Secure Generator
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python amp/generator.py

      - name: Commit and Push Drafts / State
        uses: stefanzwei/git-auto-commit-action@v5
        with:
          commit_message: "Auto-generated secure daily content bundle [skip ci]"
          branch: main
